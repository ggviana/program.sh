name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        env:
          # Pinned rather than taken from the runner image, whose bats version
          # moves with the image: BATS_TEST_TMPDIR, which the suite relies on,
          # only exists from 1.4 onwards.
          BATS_VERSION: v1.13.0
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Test
        run: make test

  fmt-lint:
    runs-on: ubuntu-latest
    # Raised above the workflow default because this job pushes the formatting commit
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt
        env:
          # Pinned rather than resolved from the releases API: that call is
          # unauthenticated, and shared runner IPs regularly exhaust the 60/hr
          # rate limit, leaving the version empty and the download URL a 404.
          SHFMT_VERSION: v3.14.1
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: Format
        run: make fmt

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "style: apply shfmt formatting"
          git push

      - name: Lint
        run: make lint
