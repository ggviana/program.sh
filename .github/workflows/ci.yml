name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fmt-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt
        env:
          # Pinned rather than resolved from the releases API: that call is
          # unauthenticated, and shared runner IPs regularly exhaust the 60/hr
          # rate limit, leaving the version empty and the download URL a 404.
          SHFMT_VERSION: v3.14.1
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: Format
        run: make fmt

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git commit -am "style: apply shfmt formatting"
          git push

      - name: Lint
        run: make lint
